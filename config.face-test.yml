# 仅用于表情包功能测试，由 test/face.js 通过 QQBOT_CONFIG 加载。
onebot:
  mode: forward
  url: ws://127.0.0.1:39601
  accessToken: "face-token"
  reconnectInterval: 300

llm:
  baseURL: http://127.0.0.1:39602/v1
  apiKey: "sk-test-fake-key"
  model: test-model
  temperature: 0
  maxTokens: 300
  timeout: 10000
  systemPrompt: |
    你是客服小祥。

trigger:
  privateChat: true
  groupChat: true
  allowGroups:
    - "200000001"
  requireAtInGroup: true
  keywords: []
  historyRounds: 1
  cooldownMs: 0
  maxInputChars: 1000

status:
  enable: false
  host: ""
  keywords: []

teach:
  enable: false
  teachers: []
  keywords: []

# 故意设小，逼出分条场景
chunking:
  maxChars: 40
  delayMs: 50
  firstFlushChars: 20

ownerQQ: "10000001"
logLevel: info

# 测试专用：独立端口，避免多个测试抢 3099
webui:
  enable: false
  port: 3102

# ⚠️ 测试里关掉在线时长跟踪 —— 它会自己独立查服务器，
#    会污染「查询次数」类断言（真实踩过）
sessions:
  enable: false
