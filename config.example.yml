      - 建设
      - 申请
      - op
      - 管理员
      - 在线
    probability: 0.35
    cooldownMs: 180000
    requireQuestionMark: true
    minChars: 5
  mention:
    enable: true
    names:
      - 小祥
      - 祥子
      - 客服小祥
      - 大祥
      - 大祥老师
      - 祥老师
      - 祥子老师
      - 祥宝
      - 丰川祥子
      - 丰川
      - saki
      - sakiko
      - togawa
      - zyhg
      - oblivionis
      - オブリビオニス
      - 章鱼小祥
      - 章鱼祥
      - 白祥
      - 黑祥
      - 骆驼祥子
      - 小祥酱
      - 祥子酱
      - saki酱
    probability: 0.4
    cooldownMs: 300000
    minChars: 2
  followUp:
    enable: true
    idleMs: 25000
    # ⚠️ **同一个人**接着跟你说时的窗口（比 idleMs 长）—— 2026-09-15 实测：
    #    85 秒后他接的那句「那最近mc圈有什么炸裂的视频」被窗口挡掉了，她没接。
    #    这明明就是在跟她说话，所以单独给一个宽窗口（仍然要过判断，不是必接）。
    sameUserMs: 180000
    probability: 1
    maxChain: 2
    minChars: 2
  strictness: 30
  ackAfterMs: 30000
attitude:
  allowAnger: true
  allowRetort: true
  denyBeingBot: true
life:
