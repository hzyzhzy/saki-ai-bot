  delayMs: 650
  firstFlushChars: 25
webui:
  enable: true
  host: 127.0.0.1
  port: 3099
faces:
  collect: true
chat:
  enable: true
  group: '200000001'
  question:
    enable: true
    keywords:
      - 服务器
      - 崩了
      - 卡
      - 模组
      - 存档
      - 怎么进
      - mtr
