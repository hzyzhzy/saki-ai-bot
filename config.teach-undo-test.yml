# 仅用于 test/teach-undo.js（「撤回扩展到教学」）—— 假 LLM 挂在 127.0.0.1:39092。
# ⚠️ 由那个套件通过 QQBOT_CONFIG 加载，而**假服务是它自己起的**；
#    单独运行这个套件之外的东西请用 config.yml。
# ⚠️ 端口和别的套件错开：39090/39091 是 rewrite、39001/39002 是 e2e ——
#    撞端口会让两边都莫名超时。
onebot:
  mode: forward
  url: ws://127.0.0.1:39093
  accessToken: "test-token"
llm:
  baseURL: http://127.0.0.1:39092/v1
  apiKey: "sk-test-fake-key"
  model: test-model
  temperature: 0.8
  maxTokens: 200
  timeout: 5000
  # ⚠️ 教学要经过 `classify()`（一次 `phrase()` 调用）——
  #    假模型回 `{"cat":"server-basic"}`，这条超时给短一点，别拖着套件。
  phraseTimeoutMs: 5000
  systemPrompt: "你是测试机器人。"
trigger:
  privateChat: false
  allowPrivateUsers: []
  groupChat: true
  requireAtInGroup: true
  keywords: []
teach:
  enable: true
  # ⚠️ 教学权限：这套件用服主号教学，别让 requireOwnerRole 之类把路挡了。
  allowPrivateTeach: true
webui:
  enable: false
  port: 3118
adminQQ: ""
# ⚠️ 用 error 而不是 warn：套件会**故意**制造几次写入失败/回落，
#    那些 warn 打到 stderr 会被 PowerShell 当成"命令出错"
#    （本项目踩过：git push 其实成功、却被报 exit 1）。
logLevel: error
