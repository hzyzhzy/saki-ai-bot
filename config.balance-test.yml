# 仅用于 test/balance-provider.js（中转站余额适配）—— 假 LLM/中转站挂在 127.0.0.1:39094。
# ⚠️ 由那个套件通过 QQBOT_CONFIG 加载，而**假服务是它自己起的**；
#    单独运行这个套件之外的东西请用 config.yml。
# ⚠️ 端口和别的套件错开：39090/39091 是 rewrite、39092/39093 是 teach-undo、
#    39001/39002 是 e2e —— 撞端口会让两边都莫名超时。
# ⚠️ 这里**故意用假 key**：这个套件的 baseURL 指向假服务器，
#    但万一配置写错也不会拿真 key 打真接口。
onebot:
  mode: forward
  url: ws://127.0.0.1:39095
  accessToken: "test-token"
llm:
  baseURL: http://127.0.0.1:39094/v1
  apiKey: "sk-test-fake-key"
  model: test-model
  timeout: 3000
balance:
  enable: true
  provider: auto
  timeoutMs: 3000
  low: 5
  critical: 2
webui:
  enable: false
  port: 3119
adminQQ: ""
# ⚠️ 用 error 而不是 warn：套件会**故意**制造一批 404/401（探测各种中转站接口），
#    那些 warn 打到 stderr 会被 PowerShell 当成"命令出错"（本项目踩过：
#    git push 其实成功、却被报 exit 1）。
logLevel: error
