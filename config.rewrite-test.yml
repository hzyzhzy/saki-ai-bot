# 仅用于 test/rewrite.js（「套话句式」二次改写）—— 假 LLM 挂在 127.0.0.1:39090。
# ⚠️ 由那个套件通过 QQBOT_CONFIG 加载，而**假服务是它自己起的**；
#    单独运行这个套件之外的东西请用 config.yml。
# ⚠️ 端口（39090/39091）和别的套件错开：`config.test.yml` 用 39001/39002（e2e），
#    撞端口会让两边都莫名超时。
onebot:
  mode: forward
  url: ws://127.0.0.1:39091
  accessToken: "test-token"
llm:
  baseURL: http://127.0.0.1:39090/v1
  apiKey: "sk-test-fake-key"
  model: test-model
  temperature: 0.8
  maxTokens: 200
  timeout: 5000
  systemPrompt: "你是测试机器人。"
trigger:
  privateChat: false
  allowPrivateUsers: []
  groupChat: true
  requireAtInGroup: true
  keywords: []
webui:
  enable: false
  port: 3117
adminQQ: ""
# ⚠️ 用 error 而不是 warn：套件会**故意**制造几次改写失败（空/过长/过短），
#    那些 warn 打到 stderr 会被 PowerShell 当成"命令出错"（本项目踩过：
#    git push 其实成功、却被报 exit 1）。
logLevel: error
rewrite:
  enable: true
  timeoutMs: 5000
  maxTokens: 320
